# AIPC Project Configuration File
# This file defines the project metadata, dependencies, workflow, and outputs.
# Ensure to keep this file updated with any changes in the project structure or dependencies.
# Project: RS-Flood-Detection
# Version: 1.0.0

ai: Remote Sensing
domain: PA
usages: ./docs/usage.md
metadata:
  name: RS-Flood-Detection
  description: >
    This project focuses on flood detection and analysis using satellite imagery 
    (Sentinel-1 and Sentinel-2). It calculates NDWI and visualizes flood-prone areas, 
    storing results as raster and vector data for further geospatial analysis.
  kind: product-template
  ai: Remote Sensing
  domain: PA
  license: Apache License 2.0
usage:
  target_users:
    - PA operators (municipalities, regional operators, etc.)
  documentation_links:
    - usage: ./docs/usage.md
howto:
  - title: Download the flood data
    ref: ./docs/howto/download.md
  - title: Elaborate the flood data
    ref: ./docs/howto/elaborate.md
datasets:
  - id: Slopes_TN
    name: Slopes_TN
    kind: artifact
  - id: Rives_TN
    name: Rives_TN
  - id: Lakes_TN
    name: Lakes_TN
    kind: artifact
  - id: sentinel1_GRD_preflood
    name: Sentinel-1 Pre-Flood Dataset
    kind: artifact
  - id: sentinel1_GRD_postflood
    name: Sentinel-1 Post-Flood Dataset
    kind: artifact
  - id: sentinel2_pre_flood
    name: Sentinel-2 Dataset
    kind: artifact
  - id: sentinel2_post_flood
    name: Sentinel-2 Post-Flood Dataset
    kind: artifact
operations:
  - id: download_images_s1
    name: Download the Sentinel-1 images
    kind: job
    task: download
    implementation:
      framework: aixpa
      spec:
        kind: container
        image: ghcr.io/tn-aixpa/sentinel-tools:0.11.1_dev
    inputs:
      - parameters:
          - name: start_date
            type: string
            description: Start date for the data download in YYYY-MM-DD format.
          - name: end_date
            type: string
            description: End date for the data download in YYYY-MM-DD format.
          - name: geometry
            type: string
            description: Region to download the data for.
    outputs:
      zip:
        - sentinel1_GRD_preflood
          name: pre_flood_data
          kind: artifact
          description: The downloaded Sentinel-1 images (-7 days from flood).
        - sentinel1_GRD_postflood
          name: post_flood_data
          kind: artifact
          description: The downloaded Sentinel-1 images (+7 days from flood).

  - id: download_images_s2
    name: Download the Sentinel-2 images
    kind: job
    task: download
    implementation:
      framework: aixpa
      spec:
        kind: container
        image: ghcr.io/tn-aixpa/sentinel-tools:0.11.1_dev
    inputs:
      - par ameters:
          - name: start_date
            type: string
            description: Start date for the data download in YYYY-MM-DD format.
          - name: end_date
            type: string
            description: End date for the data download in YYYY-MM-DD format.
          - name: geometry
            type: string
            description: Region to download the data for.
    outputs:
      zip:
        - sentinel2_pre_flood
          name: pre_flood_data
          kind: artifact
          description: The downloaded Sentinel-2 images (-20 days from flood).
        - sentinel2_post_flood
          name: post_flood_data
          kind: artifact
          description: The downloaded Sentinel-2 images (+20 days from flood).

  - id: elaborate_images_s2
    name: Elaborate the deforestation data
    kind: job
    task: elaborate
    implementation:
      framework: aixpa
      spec:
        kind: container
        image: ghcr.io/tn-aixpa/rs-flood-mapping:latest
    inputs:
      - parameters:
          - name: sentinel1_pre_flood
            type: string
            description: Path to the pre-flood Sentinel-1 images.
          - name: sentinel1_post_flood
            type: string
            description: Path to the post-flood Sentinel-1 images.
          - name: sentinel2_pre_flood
            type: string
            description: Path to the pre-flood Sentinel-2 images.
          - name: sentinel2_post_flood
            type: string
            description: Path to the post-flood Sentinel-2 images.
          - name: geometry
            type: string
            description: Region to analyze the flood data for.
          - name: slope_data
            type: string
            description: Path to the slope data for the region.
          - name: river_data
            type: string
            description: Path to the river data for the region.
          - name: lake_data
            type: string
            description: Path to the lake data for the region.       
    outputs:
      - tiff:
          name: output_flood_mask
          kind: artifact
          description: The elaborated images in TIFF format.